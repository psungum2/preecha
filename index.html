<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AR จักรยานสีสัน</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

  #ui {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 14px 10px 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0));
    pointer-events: none;
  }
  #ui * { pointer-events: auto; }

  #title {
    position: fixed;
    top: 10px; left: 0; right: 0;
    z-index: 9999;
    text-align: center;
    color: #fff;
    font-size: 15px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    pointer-events: none;
  }

  .speed-row { display: flex; gap: 8px; }

  button {
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    background: #ffffff;
    color: #222;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  button.active {
    background: #2e86de;
    color: #fff;
  }
  #playPauseBtn {
    background: #e74c3c;
    color: #fff;
    min-width: 110px;
  }
  #playPauseBtn.paused {
    background: #27ae60;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 90%;
    max-width: 380px;
    color: #fff;
    font-size: 13px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #speedSlider { flex: 1; }
</style>
</head>

<body style="margin:0; overflow:hidden;">

  <div id="title">ส่อง Hiro Marker เพื่อดูจักรยาน AR</div>

  <div id="ui">
    <div class="slider-row">
      <span>ล้อช้า</span>
      <input type="range" id="speedSlider" min="0" max="500" value="120">
      <span>ล้อเร็ว</span>
    </div>
    <div class="speed-row">
      <button id="btnSlow" onclick="setPreset(50, this)">ปั่นช้า</button>
      <button id="btnMed" class="active" onclick="setPreset(120, this)">ปกติ</button>
      <button id="btnFast" onclick="setPreset(260, this)">ปั่นเร็ว</button>
      <button id="btnTurbo" onclick="setPreset(420, this)">เต็มสปีด</button>
    </div>
    <button id="playPauseBtn" onclick="togglePlay()">⏸ หยุดล้อ</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-assets></a-assets>

    <a-marker preset="hiro" id="marker">
      <a-entity id="bikeGroup" position="0 0 0" scale="0.8 0.8 0.8">

        <!-- ============ ล้อหลัง (หมุนได้) ============ -->
        <a-entity id="wheelRear" position="-0.4 0.28 0" spin="speed: 120; axis: z">
          <a-torus radius="0.28" radius-tubular="0.035" rotation="90 0 0"
                   color="#1c1c1c" segments-tubular="24"></a-torus>
          <a-cylinder radius="0.23" height="0.02" rotation="90 0 0"
                      color="#00cec9" metalness="0.6" roughness="0.3"></a-cylinder>
          <a-sphere radius="0.045" color="#2d3436"></a-sphere>
          <a-box width="0.015" height="0.42" depth="0.012" color="#dfe6e9"></a-box>
          <a-box width="0.015" height="0.42" depth="0.012" rotation="0 0 60" color="#dfe6e9"></a-box>
          <a-box width="0.015" height="0.42" depth="0.012" rotation="0 0 120" color="#dfe6e9"></a-box>
        </a-entity>

        <!-- ============ ล้อหน้า (หมุนได้) ============ -->
        <a-entity id="wheelFront" position="0.4 0.28 0" spin="speed: 120; axis: z">
          <a-torus radius="0.28" radius-tubular="0.035" rotation="90 0 0"
                   color="#1c1c1c" segments-tubular="24"></a-torus>
          <a-cylinder radius="0.23" height="0.02" rotation="90 0 0"
                      color="#fd79a8" metalness="0.6" roughness="0.3"></a-cylinder>
          <a-sphere radius="0.045" color="#2d3436"></a-sphere>
          <a-box width="0.015" height="0.42" depth="0.012" color="#dfe6e9"></a-box>
          <a-box width="0.015" height="0.42" depth="0.012" rotation="0 0 60" color="#dfe6e9"></a-box>
          <a-box width="0.015" height="0.42" depth="0.012" rotation="0 0 120" color="#dfe6e9"></a-box>
        </a-entity>

        <!-- ============ โครงเฟรม (สร้างด้วยสคริปต์) ============ -->
        <a-entity id="bikeFrame"></a-entity>

        <!-- อานจักรยาน -->
        <a-cylinder position="-0.20 0.64 0" radius="0.02" height="0.08" color="#636e72"></a-cylinder>
        <a-box position="-0.23 0.71 0" width="0.24" height="0.045" depth="0.1"
               rotation="0 0 -8" color="#2d3436"></a-box>

        <!-- แฮนด์และก้านแฮนด์ -->
        <a-cylinder position="0.33 0.68 0" radius="0.022" height="0.34" rotation="90 0 0"
                    color="#00b894"></a-cylinder>
        <a-sphere position="0.33 0.68 0.17" radius="0.03" color="#ff7675"></a-sphere>
        <a-sphere position="0.33 0.68 -0.17" radius="0.03" color="#ff7675"></a-sphere>

        <!-- ล้อบันได/ขาจาน -->
        <a-cylinder position="-0.08 0.14 0" radius="0.02" height="0.3" rotation="90 0 0"
                    color="#fdcb6e"></a-cylinder>
        <a-box position="-0.08 0.05 0.15" width="0.06" height="0.02" depth="0.09" color="#2d3436"></a-box>
        <a-box position="-0.08 0.05 -0.15" width="0.06" height="0.02" depth="0.09" color="#2d3436"></a-box>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // คอมโพเนนต์สำหรับหมุนล้อจักรยาน ปรับความเร็ว (องศา/วินาที) ได้แบบเรียลไทม์
    AFRAME.registerComponent('spin', {
      schema: {
        speed: { type: 'number', default: 90 }, // องศาต่อวินาที
        axis:  { type: 'string', default: 'z' }
      },
      tick: function (time, timeDelta) {
        if (!this.data.speed) return;
        var deg = this.data.speed * (timeDelta / 1000);
        var rot = this.el.getAttribute('rotation');
        rot[this.data.axis] = (rot[this.data.axis] + deg) % 360;
        this.el.setAttribute('rotation', rot);
      }
    });

    // ---------- สร้างท่อเฟรมจักรยานระหว่างจุด 2 จุดแบบสีสันสวยงาม ----------
    function addTube(parent, p1, p2, radius, color) {
      var dx = p2[0] - p1[0];
      var dy = p2[1] - p1[1];
      var length = Math.sqrt(dx * dx + dy * dy);
      var angleDeg = Math.atan2(-dx, dy) * 180 / Math.PI;

      var tube = document.createElement('a-cylinder');
      tube.setAttribute('radius', radius);
      tube.setAttribute('height', length);
      tube.setAttribute('color', color);
      tube.setAttribute('metalness', '0.3');
      tube.setAttribute('roughness', '0.4');
      tube.setAttribute('position', {
        x: (p1[0] + p2[0]) / 2,
        y: (p1[1] + p2[1]) / 2,
        z: 0
      });
      tube.setAttribute('rotation', { x: 0, y: 0, z: angleDeg });
      parent.appendChild(tube);
    }

    function buildBikeFrame() {
      var frame = document.getElementById('bikeFrame');

      var rearHub    = [-0.40, 0.28];
      var frontHub   = [ 0.40, 0.28];
      var bb         = [-0.08, 0.14];
      var seatTop    = [-0.20, 0.60];
      var headTop    = [ 0.33, 0.55];
      var headBottom = [ 0.36, 0.24];

      addTube(frame, rearHub, bb,         0.026, '#e67e22'); // ก้านล่างหลัง (ส้ม)
      addTube(frame, rearHub, seatTop,    0.024, '#e74c3c'); // ก้านที่นั่งหลัง (แดง)
      addTube(frame, bb, seatTop,         0.03,  '#f1c40f'); // ท่อที่นั่ง (เหลือง)
      addTube(frame, seatTop, headTop,    0.028, '#2ecc71'); // ท่อบน (เขียว)
      addTube(frame, bb, headBottom,      0.032, '#3498db'); // ท่อล่าง (น้ำเงิน)
      addTube(frame, headTop, headBottom, 0.032, '#e84393'); // ท่อคอ (ชมพู)
      addTube(frame, headBottom, frontHub,0.024, '#9b59b6'); // ตะเกียบหน้า (ม่วง)
    }
    buildBikeFrame();

    var currentSpeed = 120;
    var isPlaying = true;

    function applySpeed() {
      var s = isPlaying ? currentSpeed : 0;
      document.querySelector('#wheelRear').setAttribute('spin', 'speed', s);
      document.querySelector('#wheelFront').setAttribute('spin', 'speed', s);
    }

    function setPreset(speed, btn) {
      currentSpeed = speed;
      document.getElementById('speedSlider').value = speed;
      document.querySelectorAll('.speed-row button').forEach(function (b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      if (!isPlaying) { togglePlay(); } else { applySpeed(); }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      var btn = document.getElementById('playPauseBtn');
      if (isPlaying) {
        btn.textContent = '⏸ หยุดล้อ';
        btn.classList.remove('paused');
      } else {
        btn.textContent = '▶ หมุนล้อ';
        btn.classList.add('paused');
      }
      applySpeed();
    }

    document.getElementById('speedSlider').addEventListener('input', function (e) {
      currentSpeed = parseInt(e.target.value, 10);
      document.querySelectorAll('.speed-row button').forEach(function (b) {
        b.classList.remove('active');
      });
      if (!isPlaying) { togglePlay(); return; }
      applySpeed();
    });
  </script>

</body>
</html>
