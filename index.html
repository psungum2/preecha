<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AR ชิงช้าสวรรค์</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

  #ui {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 14px 10px 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0));
    pointer-events: none;
  }
  #ui * { pointer-events: auto; }

  #title {
    position: fixed;
    top: 10px; left: 0; right: 0;
    z-index: 9999;
    text-align: center;
    color: #fff;
    font-size: 15px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    pointer-events: none;
  }

  .speed-row { display: flex; gap: 8px; }

  button {
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    background: #ffffff;
    color: #222;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  button.active {
    background: #2e86de;
    color: #fff;
  }
  #playPauseBtn {
    background: #e74c3c;
    color: #fff;
    min-width: 110px;
  }
  #playPauseBtn.paused {
    background: #27ae60;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 90%;
    max-width: 380px;
    color: #fff;
    font-size: 13px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #speedSlider { flex: 1; }
</style>
</head>

<body style="margin:0; overflow:hidden;">

  <div id="title">ส่อง Hiro Marker เพื่อดูชิงช้าสวรรค์ AR</div>

  <div id="ui">
    <div class="slider-row">
      <span>ช้า</span>
      <input type="range" id="speedSlider" min="0" max="300" value="60">
      <span>เร็ว</span>
    </div>
    <div class="speed-row">
      <button id="btnSlow" onclick="setPreset(25, this)">ช้ามาก</button>
      <button id="btnMed" class="active" onclick="setPreset(60, this)">ปกติ</button>
      <button id="btnFast" onclick="setPreset(140, this)">เร็ว</button>
      <button id="btnTurbo" onclick="setPreset(260, this)">เร็วมาก</button>
    </div>
    <button id="playPauseBtn" onclick="togglePlay()">⏸ หยุดหมุน</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-assets></a-assets>

    <a-marker preset="hiro" id="marker">
      <!-- โครงสร้างทั้งหมดยืนตั้งฉากบน marker เหมือนชิงช้าสวรรค์จริง -->
      <a-entity id="ferrisGroup" position="0 0 0" scale="0.75 0.75 0.75">

        <!-- ขาตั้ง + เพลากลาง สร้างด้วยสคริปต์ (คงที่ ไม่หมุน) -->
        <a-entity id="supports"></a-entity>

        <!-- ============ ล้อชิงช้าสวรรค์ (หมุนได้) ============ -->
        <a-entity id="wheel" position="0 0.6 0" spin="speed: 60; axis: z">
          <a-torus radius="0.42" radius-tubular="0.028" rotation="90 0 0"
                   color="#e74c3c" segments-tubular="32"></a-torus>
          <a-sphere radius="0.07" color="#2d3436"></a-sphere>
          <a-entity id="spokesAndCabins"></a-entity>
        </a-entity>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // คอมโพเนนต์หมุนล้อชิงช้าสวรรค์ ปรับความเร็ว (องศา/วินาที) ได้แบบเรียลไทม์
    AFRAME.registerComponent('spin', {
      schema: {
        speed: { type: 'number', default: 60 },
        axis:  { type: 'string', default: 'z' }
      },
      tick: function (time, timeDelta) {
        if (!this.data.speed) return;
        var deg = this.data.speed * (timeDelta / 1000);
        var rot = this.el.getAttribute('rotation');
        rot[this.data.axis] = (rot[this.data.axis] + deg) % 360;
        this.el.setAttribute('rotation', rot);
      }
    });

    // คอมโพเนนต์หมุนกลับ ทำให้กระเช้าตั้งตรงตลอดเวลาแม้ล้อจะหมุน (เหมือนชิงช้าสวรรค์จริง)
    AFRAME.registerComponent('counter-spin', {
      schema: { target: { type: 'selector' } },
      tick: function () {
        if (!this.data.target) return;
        var rot = this.data.target.getAttribute('rotation');
        this.el.setAttribute('rotation', { x: 0, y: 0, z: -rot.z });
      }
    });

    // ---------- สร้างท่อเชื่อมระหว่างจุด 2 จุดในสามมิติ ----------
    function addTube(parent, p1, p2, radius, color) {
      var v1 = new THREE.Vector3(p1[0], p1[1], p1[2] || 0);
      var v2 = new THREE.Vector3(p2[0], p2[1], p2[2] || 0);
      var dir = new THREE.Vector3().subVectors(v2, v1);
      var length = dir.length();
      var mid = new THREE.Vector3().addVectors(v1, v2).multiplyScalar(0.5);
      var quat = new THREE.Quaternion().setFromUnitVectors(
        new THREE.Vector3(0, 1, 0), dir.clone().normalize()
      );
      var euler = new THREE.Euler().setFromQuaternion(quat, 'YXZ');

      var tube = document.createElement('a-cylinder');
      tube.setAttribute('radius', radius);
      tube.setAttribute('height', length);
      tube.setAttribute('color', color);
      tube.setAttribute('metalness', '0.3');
      tube.setAttribute('roughness', '0.5');
      tube.setAttribute('position', { x: mid.x, y: mid.y, z: mid.z });
      tube.setAttribute('rotation', {
        x: THREE.MathUtils.radToDeg(euler.x),
        y: THREE.MathUtils.radToDeg(euler.y),
        z: THREE.MathUtils.radToDeg(euler.z)
      });
      parent.appendChild(tube);
    }

    var hubY = 0.6;

    function buildSupports() {
      var group = document.getElementById('supports');
      var baseX = 0.4, baseZ = 0.22;

      // ขาตั้งรูปตัว A ทั้งด้านหน้าและด้านหลัง
      addTube(group, [-baseX, 0, -baseZ], [0, hubY, -baseZ], 0.03, '#34495e');
      addTube(group, [ baseX, 0, -baseZ], [0, hubY, -baseZ], 0.03, '#34495e');
      addTube(group, [-baseX, 0,  baseZ], [0, hubY,  baseZ], 0.03, '#34495e');
      addTube(group, [ baseX, 0,  baseZ], [0, hubY,  baseZ], 0.03, '#34495e');

      // เพลากลางเชื่อมสองด้าน
      addTube(group, [0, hubY, -baseZ], [0, hubY, baseZ], 0.05, '#7f8c8d');

      // คานฐานเชื่อมความมั่นคง
      addTube(group, [-baseX, 0, -baseZ], [-baseX, 0, baseZ], 0.022, '#2c3e50');
      addTube(group, [ baseX, 0, -baseZ], [ baseX, 0, baseZ], 0.022, '#2c3e50');
    }

    function buildSpokesAndCabins() {
      var group = document.getElementById('spokesAndCabins');
      var R = 0.42;
      var cabinColors = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71',
                          '#1abc9c', '#3498db', '#9b59b6', '#fd79a8'];
      var count = 8;

      for (var i = 0; i < count; i++) {
        var theta = (i * 2 * Math.PI) / count;
        var x = R * Math.sin(theta);
        var y = R * Math.cos(theta);

        // ซี่ล้อ จากจุดศูนย์กลางไปขอบวง (หมุนไปพร้อมล้อ)
        addTube(group, [0, 0, 0], [x, y, 0], 0.016, '#bdc3c7');

        // จุดยึดกระเช้าที่ขอบวง (หมุนไปพร้อมล้อ)
        var pivot = document.createElement('a-entity');
        pivot.setAttribute('position', { x: x, y: y, z: 0 });

        // ตัวกระเช้า หมุนกลับอัตโนมัติให้ตั้งตรงเสมอ
        var upright = document.createElement('a-entity');
        upright.setAttribute('counter-spin', 'target: #wheel');

        var rod = document.createElement('a-cylinder');
        rod.setAttribute('radius', '0.012');
        rod.setAttribute('height', '0.1');
        rod.setAttribute('position', '0 -0.05 0');
        rod.setAttribute('color', '#7f8c8d');

        var cabin = document.createElement('a-box');
        cabin.setAttribute('width', '0.13');
        cabin.setAttribute('height', '0.11');
        cabin.setAttribute('depth', '0.13');
        cabin.setAttribute('position', '0 -0.15 0');
        cabin.setAttribute('color', cabinColors[i % cabinColors.length]);

        var roof = document.createElement('a-cylinder');
        roof.setAttribute('radius', '0.08');
        roof.setAttribute('height', '0.015');
        roof.setAttribute('position', '0 -0.095 0');
        roof.setAttribute('color', '#2d3436');

        upright.appendChild(rod);
        upright.appendChild(cabin);
        upright.appendChild(roof);
        pivot.appendChild(upright);
        group.appendChild(pivot);
      }
    }

    buildSupports();
    buildSpokesAndCabins();

    var currentSpeed = 60;
    var isPlaying = true;

    function applySpeed() {
      document.querySelector('#wheel').setAttribute('spin', 'speed', isPlaying ? currentSpeed : 0);
    }

    function setPreset(speed, btn) {
      currentSpeed = speed;
      document.getElementById('speedSlider').value = speed;
      document.querySelectorAll('.speed-row button').forEach(function (b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      if (!isPlaying) { togglePlay(); } else { applySpeed(); }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      var btn = document.getElementById('playPauseBtn');
      if (isPlaying) {
        btn.textContent = '⏸ หยุดหมุน';
        btn.classList.remove('paused');
      } else {
        btn.textContent = '▶ หมุนต่อ';
        btn.classList.add('paused');
      }
      applySpeed();
    }

    document.getElementById('speedSlider').addEventListener('input', function (e) {
      currentSpeed = parseInt(e.target.value, 10);
      document.querySelectorAll('.speed-row button').forEach(function (b) {
        b.classList.remove('active');
      });
      if (!isPlaying) { togglePlay(); return; }
      applySpeed();
    });
  </script>

</body>
</html>
