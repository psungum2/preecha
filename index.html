<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AR ชิงช้าสวรรค์ · Hiro Marker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<!--
  วิธีใช้งาน
  1) ไฟล์นี้ต้องรันผ่านเว็บเซิร์ฟเวอร์ (http:// หรือ https://) เบราว์เซอร์จะบล็อกกล้องถ้าเปิดแบบไฟล์ตรง ๆ (file://)
     ตัวอย่างการรันแบบเร็ว ๆ ในโฟลเดอร์ที่มีไฟล์นี้:
       - Python:  python -m http.server 8080   แล้วเปิด http://localhost:8080
       - Node:    npx serve .
       - VS Code: ใช้ส่วนขยาย Live Server
  2) เตรียมภาพ Hiro Marker ไปแสดงอีกจอ/ปรินท์ออกมา:
       https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png
  3) เปิดหน้านี้บนอุปกรณ์ที่มีกล้อง อนุญาตสิทธิ์กล้อง แล้วส่องไปที่ Hiro Marker
     จะเห็นชิงช้าสวรรค์ปรากฏขึ้น พร้อมแผงควบคุมด้านล่างจอ
-->

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-night:#0b1220;
    --panel-1:#1b2740;
    --panel-2:#111a2e;
    --line:#2c3a5c;
    --ivory:#f4f1ea;
    --muted:#93a1c2;
    --amber:#ffc145;
    --teal:#2ec4b6;
    --coral:#e4572e;
  }

  html, body{
    margin:0; height:100%; background:#000; overflow:hidden;
    font-family:'Inter', system-ui, sans-serif;
  }
  a-scene{ position:fixed; inset:0; }

  button, input{ font-family:inherit; }
  button:focus-visible, input:focus-visible{
    outline:2px solid var(--teal); outline-offset:2px;
  }

  #ui{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    color:var(--ivory);
    text-shadow:none;
  }

  .marquee{
    display:flex; align-items:center; gap:10px;
    padding:8px 16px;
    background:linear-gradient(180deg, var(--panel-1), var(--panel-2));
    border-top:1px solid var(--line);
  }
  .marquee .title{
    font-family:'Baloo 2', cursive; font-weight:700; font-size:16px; letter-spacing:.2px;
  }
  .marquee .hint{ margin-left:auto; font-size:12px; color:var(--muted); }
  .dot{
    width:9px; height:9px; border-radius:50%;
    background:#5a3d1f; box-shadow:0 0 0 3px rgba(255,193,69,.08);
    transition:background .25s, box-shadow .25s;
    flex:none;
  }
  .dot.found{ background:var(--teal); box-shadow:0 0 10px 2px var(--teal); }

  .console{
    display:flex;
    background:var(--panel-2);
    border-top:1px solid var(--line);
    padding:14px 10px calc(14px + env(safe-area-inset-bottom));
  }
  .cluster{
    flex:1; min-width:0;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:0 10px;
  }
  .cluster + .cluster{ border-left:1px solid var(--line); }
  .cluster label{
    font-family:'Baloo 2', cursive; font-size:13px; color:var(--muted); font-weight:500;
  }

  #speedSlider{
    -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:3px;
    background:linear-gradient(90deg, var(--teal), var(--amber), var(--coral));
    outline:none; cursor:pointer;
  }
  #speedSlider::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
    background:var(--ivory); border:3px solid var(--panel-2);
    box-shadow:0 0 0 2px var(--line); cursor:pointer;
  }
  #speedSlider::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%;
    background:var(--ivory); border:3px solid var(--panel-2); cursor:pointer;
  }
  .readout{ font-variant-numeric:tabular-nums; font-size:13px; }
  .presets{ display:flex; gap:4px; flex-wrap:wrap; justify-content:center; }
  .presets button{
    border:1px solid var(--line); background:var(--panel-1); color:var(--ivory);
    font-size:11px; padding:4px 9px; border-radius:10px; cursor:pointer;
  }
  .presets button:active{ background:var(--teal); color:var(--panel-2); }

  .switch{
    width:52px; height:28px; border-radius:16px; background:#2a3350;
    border:1px solid var(--line); position:relative; cursor:pointer; padding:0;
  }
  .switch .knob{
    position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%;
    background:#7c88a8; transition:left .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .switch.on{ background:linear-gradient(90deg, var(--amber), var(--coral)); }
  .switch.on .knob{ left:26px; background:#fff8ec; box-shadow:0 0 8px 2px rgba(255,193,69,.8); }
  .state{ font-size:12px; color:var(--muted); }

  .swatches{ display:flex; gap:6px; }
  .swatch{
    --c:#ffc145;
    width:26px; height:26px; border-radius:50%; padding:0; cursor:pointer;
    border:2px solid rgba(255,255,255,.25);
    background:radial-gradient(circle at 35% 30%, #ffffffaa, var(--c) 60%);
  }
  .swatch.active{ border-color:var(--ivory); box-shadow:0 0 0 2px var(--ivory); }
  #customColor{
    width:26px; height:26px; padding:0; border:none; border-radius:50%; cursor:pointer; background:none;
  }
  .color-row{ display:flex; align-items:center; gap:8px; }

  @media (max-width:420px){
    .console{ flex-wrap:wrap; }
    .cluster{ flex:1 1 45%; border-left:none; margin-bottom:6px; }
  }
  @media (prefers-reduced-motion: reduce){
    .switch .knob{ transition:none; }
    .dot{ transition:none; }
  }
</style>
</head>
<body>

<a-scene
  vr-mode-ui="enabled: false"
  renderer="antialias: true; alpha: true"
  embedded
  arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;">

  <a-marker id="hiroMarker" preset="hiro" emitevents="true">

    <!-- ฐานตั้ง -->
    <a-cylinder position="0 0.005 -0.05" radius="0.16" height="0.01"
                color="#242b3d" metalness="0.3" roughness="0.7"></a-cylinder>
    <a-cylinder position="0 0.15 -0.05" radius="0.018" height="0.3"
                color="#2c3446" metalness="0.4" roughness="0.6"></a-cylinder>

    <!-- ตัวชิงช้าสวรรค์ (หมุนรอบแกน Z ให้ตั้งขึ้นเหมือนของจริง) -->
    <a-entity id="wheelGroup" position="0 0.3 -0.05">
      <a-cylinder id="hub" radius="0.035" height="0.05" rotation="90 0 0"
                  color="#2b2f3a" metalness="0.6" roughness="0.4"></a-cylinder>
      <a-torus id="rim" radius="0.26" radius-tubular="0.014"
               color="#3a4256" metalness="0.5" roughness="0.4"></a-torus>
      <a-entity id="spokes"></a-entity>
      <a-entity id="cabins"></a-entity>
      <a-entity id="bulbs"></a-entity>
    </a-entity>

    <a-entity light="type: point; intensity: 0.5; distance: 3" position="0 0.6 0.4"></a-entity>
  </a-marker>

  <a-entity light="type: ambient; color: #8f97ad; intensity: 0.9"></a-entity>
  <a-entity camera></a-entity>
</a-scene>

<div id="ui">
  <div class="marquee">
    <span class="dot" id="statusDot"></span>
    <span class="title">ควบคุมชิงช้าสวรรค์ AR</span>
    <span class="hint" id="hint">ส่องกล้องไปที่ Hiro Marker</span>
  </div>

  <div class="console">
    <div class="cluster">
      <label>ความเร็วหมุน</label>
      <input type="range" id="speedSlider" min="0" max="200" value="0" step="1"
             aria-label="ปรับความเร็วการหมุน">
      <div class="readout"><span id="speedValue">0</span>°/วิ</div>
      <div class="presets">
        <button type="button" data-speed="0">หยุด</button>
        <button type="button" data-speed="30">ช้า</button>
        <button type="button" data-speed="90">ปานกลาง</button>
        <button type="button" data-speed="180">เร็ว</button>
      </div>
    </div>

    <div class="cluster">
      <label>ไฟหลอด</label>
      <button type="button" id="powerToggle" class="switch" aria-pressed="false" aria-label="เปิด/ปิดไฟ">
        <span class="knob"></span>
      </button>
      <div class="state" id="powerState">ปิด</div>
    </div>

    <div class="cluster">
      <label>สีหลอดไฟ</label>
      <div class="swatches">
        <button type="button" class="swatch" style="--c:#ffc145" data-color="#ffc145" aria-label="สีเหลืองอำพัน"></button>
        <button type="button" class="swatch" style="--c:#e4572e" data-color="#e4572e" aria-label="สีส้มแดง"></button>
        <button type="button" class="swatch" style="--c:#2ec4b6" data-color="#2ec4b6" aria-label="สีเขียวอมฟ้า"></button>
        <button type="button" class="swatch" style="--c:#8e7cff" data-color="#8e7cff" aria-label="สีม่วง"></button>
        <button type="button" class="swatch" style="--c:#ff6fb0" data-color="#ff6fb0" aria-label="สีชมพู"></button>
      </div>
      <div class="color-row">
        <input type="color" id="customColor" value="#ffc145" aria-label="เลือกสีเอง">
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var RADIUS = 0.26;
  var NUM_CABINS = 8;
  var NUM_BULBS = 16;
  var currentColor = '#ffc145';
  var lightsOn = false;

  // หมุนวงล้อรอบแกน Z ด้วยความเร็ว (องศา/วินาที) ที่กำหนดผ่านแผงควบคุม
  AFRAME.registerComponent('wheel-spin', {
    schema: { speed: { type: 'number', default: 0 } },
    tick: function (t, dt) {
      if (!dt) return;
      var rot = this.el.getAttribute('rotation');
      this.el.setAttribute('rotation', {
        x: rot.x,
        y: rot.y,
        z: rot.z + this.data.speed * (dt / 1000)
      });
    }
  });

  function buildWheel() {
    var spokesEl = document.querySelector('#spokes');
    var cabinsEl = document.querySelector('#cabins');
    var bulbsEl = document.querySelector('#bulbs');

    for (var i = 0; i < NUM_CABINS; i++) {
      var angle = (360 / NUM_CABINS) * i;
      var rad = angle * Math.PI / 180;
      var x = RADIUS * Math.cos(rad);
      var y = RADIUS * Math.sin(rad);

      var spoke = document.createElement('a-cylinder');
      spoke.setAttribute('radius', 0.008);
      spoke.setAttribute('height', RADIUS);
      spoke.setAttribute('color', '#3a4256');
      spoke.setAttribute('metalness', 0.4);
      spoke.setAttribute('roughness', 0.6);
      spoke.setAttribute('position', (x / 2) + ' ' + (y / 2) + ' 0');
      spoke.setAttribute('rotation', '0 0 ' + (angle - 90));
      spokesEl.appendChild(spoke);

      var cabin = document.createElement('a-box');
      cabin.setAttribute('width', 0.075);
      cabin.setAttribute('height', 0.06);
      cabin.setAttribute('depth', 0.075);
      cabin.setAttribute('color', '#c9463d');
      cabin.setAttribute('metalness', 0.2);
      cabin.setAttribute('roughness', 0.7);
      cabin.setAttribute('position', x + ' ' + y + ' 0.035');
      cabinsEl.appendChild(cabin);
    }

    for (var j = 0; j < NUM_BULBS; j++) {
      var bAngle = (360 / NUM_BULBS) * j;
      var bRad = bAngle * Math.PI / 180;
      var bx = (RADIUS + 0.015) * Math.cos(bRad);
      var by = (RADIUS + 0.015) * Math.sin(bRad);

      var bulb = document.createElement('a-sphere');
      bulb.setAttribute('radius', 0.016);
      bulb.setAttribute('segments-width', 8);
      bulb.setAttribute('segments-height', 6);
      bulb.setAttribute('material', 'shader: flat; color: #3a3a3a');
      bulb.setAttribute('position', bx + ' ' + by + ' 0.05');
      bulb.classList.add('bulb-entity');
      bulbsEl.appendChild(bulb);

      if (j % 4 === 0) {
        var pl = document.createElement('a-entity');
        pl.setAttribute('light', 'type: point; intensity: 0; distance: 0.5; color: ' + currentColor);
        pl.setAttribute('position', bx + ' ' + by + ' 0.06');
        pl.classList.add('bulb-light');
        bulbsEl.appendChild(pl);
      }
    }
  }

  function applyBulbVisual() {
    var color = lightsOn ? currentColor : '#3a3a3a';
    document.querySelectorAll('.bulb-entity').forEach(function (b) {
      b.setAttribute('material', 'shader: flat; color: ' + color);
    });
    document.querySelectorAll('.bulb-light').forEach(function (l) {
      l.setAttribute('light', 'intensity', lightsOn ? 0.45 : 0);
      l.setAttribute('light', 'color', currentColor);
    });
  }

  function wireUI() {
    var wheelGroup = document.querySelector('#wheelGroup');
    var speedSlider = document.querySelector('#speedSlider');
    var speedValue = document.querySelector('#speedValue');
    var presetButtons = document.querySelectorAll('.presets button');
    var powerToggle = document.querySelector('#powerToggle');
    var powerState = document.querySelector('#powerState');
    var swatches = document.querySelectorAll('.swatch');
    var customColor = document.querySelector('#customColor');
    var statusDot = document.querySelector('#statusDot');
    var hint = document.querySelector('#hint');
    var marker = document.querySelector('#hiroMarker');

    function setSpeed(v) {
      speedSlider.value = v;
      speedValue.textContent = v;
      wheelGroup.setAttribute('wheel-spin', 'speed', v);
    }

    speedSlider.addEventListener('input', function () { setSpeed(this.value); });
    presetButtons.forEach(function (btn) {
      btn.addEventListener('click', function () { setSpeed(this.dataset.speed); });
    });

    powerToggle.addEventListener('click', function () {
      lightsOn = !lightsOn;
      powerToggle.classList.toggle('on', lightsOn);
      powerToggle.setAttribute('aria-pressed', String(lightsOn));
      powerState.textContent = lightsOn ? 'เปิด' : 'ปิด';
      applyBulbVisual();
    });

    function selectColor(hex) {
      currentColor = hex;
      customColor.value = hex;
      swatches.forEach(function (s) {
        s.classList.toggle('active', s.dataset.color.toLowerCase() === hex.toLowerCase());
      });
      applyBulbVisual();
    }
    swatches.forEach(function (s) {
      s.addEventListener('click', function () { selectColor(this.dataset.color); });
    });
    customColor.addEventListener('input', function () { selectColor(this.value); });

    marker.addEventListener('markerFound', function () {
      statusDot.classList.add('found');
      hint.textContent = 'พบมาร์กเกอร์แล้ว';
    });
    marker.addEventListener('markerLost', function () {
      statusDot.classList.remove('found');
      hint.textContent = 'ส่องกล้องไปที่ Hiro Marker';
    });

    setSpeed(0);
    selectColor(currentColor);
  }

  buildWheel();
  wireUI();
})();
</script>
</body>
</html>
