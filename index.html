<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AR ชิงช้าสวรรค์ - Hiro Marker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<!-- ต้องรันผ่าน HTTPS หรือ localhost เพื่อขอสิทธิ์กล้อง -->
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; }

  #uiRoot {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  #toggleBtn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(20,20,20,0.75);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }

  #controlPanel {
    background: rgba(20,20,20,0.72);
    color: #fff;
    border-radius: 10px;
    padding: 10px 12px;
    width: 168px;
    font-size: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transition: opacity 0.15s ease, transform 0.15s ease;
  }

  #controlPanel.hidden {
    display: none;
  }

  .row {
    margin-bottom: 8px;
  }
  .row:last-child { margin-bottom: 0; }

  .row label {
    display: block;
    margin-bottom: 3px;
    opacity: 0.85;
  }

  .row input[type="range"] {
    width: 100%;
  }

  .row input[type="color"] {
    width: 100%;
    height: 26px;
    border: none;
    padding: 0;
    background: none;
    cursor: pointer;
  }

  #lightBtn {
    width: 100%;
    padding: 6px 0;
    border: none;
    border-radius: 6px;
    background: #f5a623;
    color: #1a1a1a;
    font-weight: bold;
    cursor: pointer;
  }
  #lightBtn.off {
    background: #555;
    color: #ddd;
  }

  #hint {
    position: fixed;
    bottom: 10px;
    left: 10px;
    right: 10px;
    color: #fff;
    background: rgba(0,0,0,0.55);
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 8px;
    z-index: 999;
    text-align: center;
  }
</style>
</head>
<body>

<!-- ===== เมนูควบคุม (ลอยทับหน้าจอ ย่อ/ขยายได้) ===== -->
<div id="uiRoot">
  <button id="toggleBtn" onclick="togglePanel()">⚙</button>
  <div id="controlPanel">
    <div class="row">
      <label>ความเร็วหมุน (ช้า ↔ เร็ว)</label>
      <input type="range" min="-4" max="4" step="0.1" value="1" oninput="updateSpeed(this.value)">
    </div>
    <div class="row">
      <label>สีหลอดไฟ</label>
      <input type="color" value="#ffcc33" oninput="updateColor(this.value)">
    </div>
    <div class="row">
      <button id="lightBtn" onclick="toggleLights()">ปิดไฟ</button>
    </div>
  </div>
</div>

<div id="hint">ส่อง Hiro Marker ให้เห็นในกล้องเพื่อแสดงชิงช้าสวรรค์</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="logarithmicDepthBuffer: true; alpha: true"
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
  wheel-controller>

  <a-assets></a-assets>

  <!-- แสงทั่วไปในฉาก -->
  <a-entity light="type: ambient; color: #ffffff; intensity: 0.7"></a-entity>
  <a-entity light="type: directional; color: #ffffff; intensity: 0.5" position="1 1 1"></a-entity>

  <a-marker preset="hiro">

    <!-- ขาตั้งชิงช้าสวรรค์ (ไม่หมุน) -->
    <a-box position="-0.55 0.95 0" rotation="0 0 12" width="0.06" height="1.9" depth="0.06" color="#5a4632"></a-box>
    <a-box position="0.55 0.95 0" rotation="0 0 -12" width="0.06" height="1.9" depth="0.06" color="#5a4632"></a-box>
    <a-box position="0 1.55 0" width="1.25" height="0.05" depth="0.05" color="#5a4632"></a-box>

    <!-- ตัวชิงช้าสวรรค์ที่หมุนได้ ศูนย์กลางอยู่ที่ (0, 1.7, 0) -->
    <a-entity id="wheelRig" position="0 1.7 0">

      <!-- ขอบวงล้อ -->
      <a-torus radius="1.2" radius-tubular="0.04" segments-tubular="10" color="#888888" metalness="0.6" roughness="0.4"></a-torus>

      <!-- ดุมกลาง -->
      <a-sphere radius="0.13" color="#333333"></a-sphere>

      <!-- ซี่ล้อ 8 อัน -->
      <a-entity class="spoke" rotation="0 0 0">
        <a-cylinder radius="0.02" height="1.2" position="0 0.6 0" color="#aaaaaa"></a-cylinder>
      </a-entity>
      <a-entity class="spoke" rotation="0 0 45">
        <a-cylinder radius="0.02" height="1.2" position="0 0.6 0" color="#aaaaaa"></a-cylinder>
      </a-entity>
      <a-entity class="spoke" rotation="0 0 90">
        <a-cylinder radius="0.02" height="1.2" position="0 0.6 0" color="#aaaaaa"></a-cylinder>
      </a-entity>
      <a-entity class="spoke" rotation="0 0 135">
        <a-cylinder radius="0.02" height="1.2" position="0 0.6 0" color="#aaaaaa"></a-cylinder>
      </a-entity>
      <a-entity class="spoke" rotation="0 0 180">
        <a-cylinder radius="0.02" height="1.2" position="0 0.6 0" color="#aaaaaa"></a-cylinder>
      </a-entity>
      <a-entity class="spoke" rotation="0 0 225">
        <a-cylinder radius="0.02" height="1.2" position="0 0.6 0" color="#aaaaaa"></a-cylinder>
      </a-entity>
      <a-entity class="spoke" rotation="0 0 270">
        <a-cylinder radius="0.02" height="1.2" position="0 0.6 0" color="#aaaaaa"></a-cylinder>
      </a-entity>
      <a-entity class="spoke" rotation="0 0 315">
        <a-cylinder radius="0.02" height="1.2" position="0 0.6 0" color="#aaaaaa"></a-cylinder>
      </a-entity>

      <!-- กระเช้า 8 อัน (คงตั้งตรงเสมอด้วยสคริปต์) -->
      <a-entity class="cabin-wrapper" position="1.15 0 0">
        <a-box class="cabin" position="0 -0.16 0" width="0.22" height="0.2" depth="0.2" color="#ff5555"></a-box>
      </a-entity>
      <a-entity class="cabin-wrapper" position="0.813 0.813 0">
        <a-box class="cabin" position="0 -0.16 0" width="0.22" height="0.2" depth="0.2" color="#55aaff"></a-box>
      </a-entity>
      <a-entity class="cabin-wrapper" position="0 1.15 0">
        <a-box class="cabin" position="0 -0.16 0" width="0.22" height="0.2" depth="0.2" color="#ffaa00"></a-box>
      </a-entity>
      <a-entity class="cabin-wrapper" position="-0.813 0.813 0">
        <a-box class="cabin" position="0 -0.16 0" width="0.22" height="0.2" depth="0.2" color="#55ff88"></a-box>
      </a-entity>
      <a-entity class="cabin-wrapper" position="-1.15 0 0">
        <a-box class="cabin" position="0 -0.16 0" width="0.22" height="0.2" depth="0.2" color="#ff5555"></a-box>
      </a-entity>
      <a-entity class="cabin-wrapper" position="-0.813 -0.813 0">
        <a-box class="cabin" position="0 -0.16 0" width="0.22" height="0.2" depth="0.2" color="#55aaff"></a-box>
      </a-entity>
      <a-entity class="cabin-wrapper" position="0 -1.15 0">
        <a-box class="cabin" position="0 -0.16 0" width="0.22" height="0.2" depth="0.2" color="#ffaa00"></a-box>
      </a-entity>
      <a-entity class="cabin-wrapper" position="0.813 -0.813 0">
        <a-box class="cabin" position="0 -0.16 0" width="0.22" height="0.2" depth="0.2" color="#55ff88"></a-box>
      </a-entity>

      <!-- หลอดไฟประดับรอบขอบล้อ 16 ดวง -->
      <a-sphere class="bulb" radius="0.045" position="1.22 0 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="1.128 0.467 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="0.863 0.863 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="0.467 1.128 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="0 1.22 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="-0.467 1.128 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="-0.863 0.863 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="-1.128 0.467 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="-1.22 0 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="-1.128 -0.467 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="-0.863 -0.863 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="-0.467 -1.128 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="0 -1.22 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="0.467 -1.128 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="0.863 -0.863 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>
      <a-sphere class="bulb" radius="0.045" position="1.128 -0.467 0.05" color="#ffcc33" material="emissive:#ffcc33; emissiveIntensity:0.9"></a-sphere>

    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  // ===== ตัวแปรควบคุมสถานะ =====
  window.wheelSpeed = 1.0;   // เรเดียน/วินาที (ค่าลบ = หมุนกลับทิศ)
  window.lightsOn = true;
  window.bulbColor = '#ffcc33';

  // ===== ควบคุมความเร็วหมุน (ช้า/เร็ว) =====
  function updateSpeed(val) {
    window.wheelSpeed = parseFloat(val);
  }

  // ===== เปิด/ปิดไฟ =====
  function toggleLights() {
    window.lightsOn = !window.lightsOn;
    var bulbs = document.querySelectorAll('.bulb');
    bulbs.forEach(function (el) {
      if (window.lightsOn) {
        el.setAttribute('color', window.bulbColor);
        el.setAttribute('material', 'emissive', window.bulbColor);
        el.setAttribute('material', 'emissiveIntensity', 0.9);
      } else {
        el.setAttribute('color', '#333333');
        el.setAttribute('material', 'emissive', '#000000');
        el.setAttribute('material', 'emissiveIntensity', 0);
      }
    });
    var btn = document.getElementById('lightBtn');
    btn.textContent = window.lightsOn ? 'ปิดไฟ' : 'เปิดไฟ';
    btn.classList.toggle('off', !window.lightsOn);
  }

  // ===== เปลี่ยนสีหลอดไฟ =====
  function updateColor(hex) {
    window.bulbColor = hex;
    if (!window.lightsOn) return;
    document.querySelectorAll('.bulb').forEach(function (el) {
      el.setAttribute('color', hex);
      el.setAttribute('material', 'emissive', hex);
    });
  }

  // ===== ย่อ/ขยายเมนู ไม่ให้บังภาพ AR =====
  function togglePanel() {
    document.getElementById('controlPanel').classList.toggle('hidden');
  }

  // ===== component หมุนล้อ + คงกระเช้าตั้งตรง =====
  AFRAME.registerComponent('wheel-controller', {
    init: function () {
      var self = this;
      // รอให้ DOM ของ a-marker พร้อมก่อนค่อยอ้างอิง object3D
      this.rigEl = document.querySelector('#wheelRig');
      this.cabinEls = Array.prototype.slice.call(document.querySelectorAll('.cabin-wrapper'));
    },
    tick: function (time, timeDelta) {
      if (!timeDelta || !this.rigEl) return;
      var dt = timeDelta / 1000;
      var rigObj = this.rigEl.object3D;
      rigObj.rotation.z += window.wheelSpeed * dt;

      var rigZ = rigObj.rotation.z;
      this.cabinEls.forEach(function (el) {
        el.object3D.rotation.z = -rigZ;
      });
    }
  });
</script>

</body>
</html>
